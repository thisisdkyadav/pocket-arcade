<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gravity Golf</title><meta name="description" content="Six orbital golf courses. Aim a shot, bend it around planets, and find the glowing portal."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23091022'/%3E%3Ccircle cx='20' cy='23' r='10' fill='%237c8aff'/%3E%3Cellipse cx='20' cy='23' rx='17' ry='5' fill='none' stroke='%237fffd4' stroke-width='2' transform='rotate(-25 20 23)'/%3E%3Ccircle cx='29' cy='8' r='3' fill='white'/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#070d1c;color:#e7edff;font-family:ui-sans-serif,system-ui,sans-serif;overflow:hidden}body{display:flex;flex-direction:column}header{height:70px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid #ffffff12;gap:12px}h1{font-size:20px;letter-spacing:-.6px;margin:0}h1 span{color:#82f9d2;font-weight:400}#stats{font-size:14px;color:#bbc8ea;display:flex;gap:24px}strong{font-size:19px;color:white}button{font:600 14px system-ui;border:1px solid #ffffff25;background:#16233c;color:#edf4ff;border-radius:9px;min-height:42px;padding:0 17px;cursor:pointer}button:hover{background:#263a59}button:focus-visible,input:focus-visible{outline:3px solid #82f9d2;outline-offset:3px}button:disabled{opacity:.45;cursor:default}#stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#111d39,transparent 75%)}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}#hint{position:absolute;top:17px;left:22px;pointer-events:none;font-size:14px;color:#8197c2}#toast{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#102338d9;border:1px solid #ffffff1c;padding:10px 18px;border-radius:50px;max-width:90%;text-align:center;font-size:14px;pointer-events:none}footer{display:flex;align-items:center;justify-content:center;gap:24px;padding:14px 22px max(14px,env(safe-area-inset-bottom));background:#0b1427;border-top:1px solid #ffffff12;flex:none}.range{display:flex;gap:10px;align-items:center;font-size:14px;color:#b5c5e5}.range input{width:130px;accent-color:#82f9d2}.range output{width:40px;color:white;font-variant-numeric:tabular-nums}#launch{background:#80f7d0;color:#061e25;border:0;min-width:115px}#overlay{display:none;position:absolute;inset:0;background:#050b1c99;align-items:center;justify-content:center;backdrop-filter:blur(6px)}#overlay.show{display:flex}.card{padding:32px;text-align:center;border:1px solid #8ba1d72e;border-radius:22px;background:#101b32ee;max-width:90%;box-shadow:0 25px 100px #0008}.card .eyebrow{color:#7df5d0;font-size:13px;letter-spacing:3px}.card h2{font-size:38px;letter-spacing:-1px;margin:14px 0}.card p{color:#b7c8e9;max-width:340px;font-size:16px;line-height:1.5}.card button{background:#80f7d0;color:#071726;margin-top:12px}.secondary{font-size:13px;color:#8197b9;text-align:center;padding:0 0 8px;background:#0b1427}@media(max-width:650px){header{height:60px;padding:0 14px}h1{font-size:17px}#stats{gap:12px;font-size:12px}strong{font-size:16px}header button{padding:0 12px}footer{gap:10px;flex-wrap:wrap;padding:10px 12px}.range{font-size:12px;gap:5px}.range input{width:85px}.range output{width:33px}#launch{min-width:85px}.secondary{font-size:12px}#hint{left:14px;top:12px;font-size:12px}#toast{font-size:12px;width:max-content}.card h2{font-size:30px}}@media(max-height:500px){header{height:44px}footer{padding:5px;gap:18px}.secondary{display:none}#hint{top:6px}#toast{bottom:8px}button{min-height:34px}}
</style></head><body><header><h1>GRAVITY <span>GOLF</span></h1><div id="stats"><span>HOLE <strong id="hole">1/6</strong></span><span>SHOTS <strong id="shots">0</strong></span></div><button id="pause" aria-label="Pause game">Ⅱ</button></header><main id="stage"><canvas id="game" aria-label="Gravity golf course. Use arrow keys to aim and space to launch." tabindex="0"></canvas><div id="hint">DRAG FROM THE BALL TO AIM</div><div id="toast" role="status" aria-live="polite">Bend your shot around the planet into the mint portal</div><div id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">ORBIT COMPLETE</div><h2 id="title">Nice shot.</h2><p id="detail"></p><button id="next">Next hole</button></div></div></main><footer><label class="range">Aim <input id="angle" type="range" min="-180" max="180" step="1" value="-25" aria-label="Launch angle"><output id="angleValue">−25°</output></label><label class="range">Power <input id="power" type="range" min="90" max="500" step="5" value="300" aria-label="Launch power"><output id="powerValue">300</output></label><button id="launch">Launch</button><button id="retry">Retry</button></footer><div class="secondary">← → aim · ↑ ↓ power · Space launch · R retry · P pause</div><script>
'use strict';
const $=s=>document.getElementById(s),canvas=$('game'),ctx=canvas.getContext('2d');
const W=1000,H=650,DT=1/120,R=7;
const levels=[
{name:'First orbit',start:[130,470],goal:[845,355],planets:[{x:500,y:440,r:65,mu:280000,color:'#7b80e9'}],aim:-35,power:360},
{name:'Twin moons',start:[120,470],goal:[855,190],planets:[{x:400,y:440,r:55,mu:220000,color:'#568ed2'},{x:670,y:310,r:46,mu:150000,color:'#b17ee3'}],aim:-46,power:410},
{name:'The slingshot',start:[130,170],goal:[845,470],planets:[{x:520,y:330,r:76,mu:400000,color:'#e7a565'}],aim:27,power:400},
{name:'Narrow passage',start:[110,320],goal:[880,320],planets:[{x:450,y:190,r:65,mu:270000,color:'#68b6b8'},{x:610,y:475,r:72,mu:290000,color:'#ae77d1'}],aim:0,power:400},
{name:'Three body problem',start:[120,505],goal:[855,150],planets:[{x:370,y:390,r:48,mu:180000,color:'#d7a16b'},{x:550,y:230,r:60,mu:230000,color:'#748ee2'},{x:760,y:440,r:45,mu:170000,color:'#78c6b8'}],aim:-40,power:440},
{name:'Final approach',start:[110,300],goal:[895,305],planets:[{x:365,y:300,r:67,mu:260000,color:'#748ee2'},{x:650,y:300,r:70,mu:270000,color:'#c982b2'}],aim:-35,power:420}
];
let level=0,shots=0,total=0,mode='aim',ball,trail=[],elapsed=0,paused=false,angle=-35,power=360,dragging=false,last=0,acc=0,scale=1,ox=0,oy=0,viewW=1000,viewH=650;
const stars=Array.from({length:100},(_,i)=>({x:(Math.sin(i*43.13)*.5+.5)*W,y:(Math.cos(i*98.7)*.5+.5)*H,r:i%8===0?1.6:.8}));
function resize(){const r=canvas.getBoundingClientRect();viewW=r.width;viewH=r.height;const d=Math.min(devicePixelRatio||1,2);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);scale=Math.min(viewW/W,viewH/H);ox=(viewW-W*scale)/2;oy=(viewH-H*scale)/2;}
function setMode(v){mode=v;$('launch').disabled=v!=='aim';$('angle').disabled=v!=='aim';$('power').disabled=v!=='aim';}
function controls(){$('angle').value=angle;$('power').value=power;$('angleValue').value=Math.round(angle)+'°';$('powerValue').value=Math.round(power);}
function resetHole(){ball={x:levels[level].start[0],y:levels[level].start[1],vx:0,vy:0};trail=[];elapsed=0;acc=0;paused=false;$('pause').textContent='Ⅱ';setMode('aim');$('overlay').classList.remove('show');$('hint').textContent=String(level+1).padStart(2,'0')+' / '+levels[level].name.toUpperCase();controls();}
function initHole(){shots=0;angle=levels[level].aim;power=levels[level].power;$('hole').textContent=(level+1)+'/6';$('shots').textContent=shots;resetHole();$('toast').textContent='Drag from the ball, then release. The dotted line predicts your orbit.';}
function step(b,dt){for(const p of levels[level].planets){const dx=p.x-b.x,dy=p.y-b.y,d2=Math.max(dx*dx+dy*dy,100);const f=p.mu/(d2*Math.sqrt(d2));b.vx+=dx*f*dt;b.vy+=dy*f*dt;}b.x+=b.vx*dt;b.y+=b.vy*dt;for(const p of levels[level].planets)if(Math.hypot(b.x-p.x,b.y-p.y)<p.r+R)return'crash';const g=levels[level].goal;if(Math.hypot(b.x-g[0],b.y-g[1])<25)return'goal';if(b.x < -45 || b.x>W+45 || b.y< -45 || b.y>H+45)return'out';return null;}
function launch(){if(mode!=='aim'||paused)return;const a=angle*Math.PI/180;ball.vx=Math.cos(a)*power;ball.vy=Math.sin(a)*power;shots++;total++;$('shots').textContent=shots;setMode('flight');$('toast').textContent='In flight…';canvas.focus();}
function finish(result){if(result==='goal'){setMode('won');$('eyebrow').textContent=level===5?'COURSE COMPLETE':'ORBIT COMPLETE';$('title').textContent=shots===1?'Hole in one.':'Portal found.';$('detail').textContent=level===5?'Six worlds, '+total+' shots. Your orbit is complete.':levels[level].name+' · '+shots+' shot'+(shots===1?'':'s');$('next').textContent=level===5?'Play again':'Next hole';$('overlay').classList.add('show');}else{setMode('miss');$('toast').textContent=result==='crash'?'Planet impact. Tap Retry or press R.':result==='timeout'?'Lost in orbit. Tap Retry or press R.':'Lost in space. Tap Retry or press R.';}}
function pause(){if(mode==='won')return;paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';$('toast').textContent=paused?'Paused · P or ▶ to resume':mode==='flight'?'In flight…':'Aim for the mint portal';}
function next(){if(mode!=='won')return;if(level===5){level=0;total=0;}else level++;initHole();}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function render(t){ctx.clearRect(0,0,viewW,viewH);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);ctx.fillStyle='#080f21';ctx.fillRect(0,0,W,H);for(const s of stars)circle(s.x,s.y,s.r,'#7996c955');ctx.strokeStyle='#34466444';ctx.lineWidth=1;ctx.strokeRect(1,1,W-2,H-2);
for(const p of levels[level].planets){ctx.strokeStyle=p.color+'12';for(let i=1;i<=3;i++){ctx.beginPath();ctx.arc(p.x,p.y,p.r+i*32,0,7);ctx.stroke();}const grd=ctx.createRadialGradient(p.x-p.r*.4,p.y-p.r*.4,2,p.x,p.y,p.r);grd.addColorStop(0,p.color);grd.addColorStop(1,'#17253f');circle(p.x,p.y,p.r,grd);ctx.strokeStyle=p.color+'88';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();circle(p.x+p.r*.3,p.y-p.r*.2,p.r*.15,'#080e2622');circle(p.x-p.r*.35,p.y+p.r*.3,p.r*.2,'#080e2622');}
const g=levels[level].goal;ctx.strokeStyle='#7ef8d0';ctx.lineWidth=3;ctx.shadowColor='#6fffda';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(g[0],g[1],22,0,7);ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#7ef8d04d';ctx.beginPath();ctx.arc(g[0],g[1],31+Math.sin(t/500)*3,0,7);ctx.stroke();circle(g[0],g[1],5,'#7ef8d0');
if(mode==='aim'){const a=angle*Math.PI/180,p={...ball,vx:Math.cos(a)*power,vy:Math.sin(a)*power};for(let i=0;i<480;i++){const hit=step(p,DT);if(i%12===0)circle(p.x,p.y,2.4,'#d0ecff'+Math.round(150*(1-i/550)).toString(16).padStart(2,'0'));if(hit)break;}ctx.strokeStyle='#81f8d0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+Math.cos(a)*Math.min(85,power/5),ball.y+Math.sin(a)*Math.min(85,power/5));ctx.stroke();}
if(trail.length>1){ctx.beginPath();trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='#c0dbff55';ctx.lineWidth=2;ctx.stroke();}ctx.shadowColor='#eefbff';ctx.shadowBlur=14;circle(ball.x,ball.y,R,'#f5fcff');ctx.shadowBlur=0;if(mode==='aim'){ctx.strokeStyle='#ffffff40';ctx.beginPath();ctx.arc(ball.x,ball.y,18,0,7);ctx.stroke();}ctx.restore();}
function frame(t){const delta=Math.min((t-last)/1000||0,.05);last=t;if(!paused&&mode==='flight'){acc+=delta;while(acc>=DT&&mode==='flight'){const hit=step(ball,DT);elapsed+=DT;acc-=DT;if(hit)finish(hit);else if(elapsed>12)finish('timeout');}trail.push({x:ball.x,y:ball.y});if(trail.length>240)trail.shift();}render(t);requestAnimationFrame(frame);}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale};}
function aimAt(e){const p=point(e),dx=p.x-ball.x,dy=p.y-ball.y;if(Math.hypot(dx,dy)<5)return;angle=Math.atan2(dy,dx)*180/Math.PI;power=Math.max(90,Math.min(500,Math.hypot(dx,dy)*2));controls();}
canvas.addEventListener('pointerdown',e=>{if(mode!=='aim'||paused)return;dragging=true;canvas.setPointerCapture(e.pointerId);aimAt(e);});canvas.addEventListener('pointermove',e=>{if(dragging)aimAt(e);});canvas.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;aimAt(e);launch();});canvas.addEventListener('pointercancel',()=>dragging=false);
$('angle').oninput=e=>{angle=+e.target.value;controls()};$('power').oninput=e=>{power=+e.target.value;controls()};$('launch').onclick=launch;$('retry').onclick=()=>{if(mode==='won')return;resetHole();$('toast').textContent='Try a new orbit';};$('pause').onclick=pause;$('next').onclick=next;
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','r','R','p','P'].includes(e.key))e.preventDefault();if(e.repeat&&[' ','r','R','p','P'].includes(e.key))return;if(e.key===' '){if(mode==='won')next();else if(paused)pause();else launch();}if(e.key.toLowerCase()==='r'&&mode!=='won')resetHole();if(e.key.toLowerCase()==='p')pause();if(mode==='aim'&&!paused){if(e.key==='ArrowLeft')angle-=2;if(e.key==='ArrowRight')angle+=2;if(e.key==='ArrowUp')power+=10;if(e.key==='ArrowDown')power-=10;angle=((angle+540)%360)-180;power=Math.max(90,Math.min(500,power));controls();}});addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused)pause();});
const api={state:()=>({level,shots,total,mode,paused,ball:{...ball},angle,power}),levels,step,aim:(a,p)=>{if(mode!=='aim'||!Number.isFinite(a)||!Number.isFinite(p)||a < -180||a>180||p<90||p>500)throw Error('Invalid aim');angle=a;power=p;controls();},launch,retry:resetHole};window.GravityGolf=api;
if(document.modelContext?.registerTool){try{document.modelContext.registerTool({name:'gravity_golf_state',description:'Read the current golf hole, aim and shot state.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>api.state()});document.modelContext.registerTool({name:'gravity_golf_aim',description:'Set launch angle and power before a shot.',inputSchema:{type:'object',properties:{angle:{type:'number',minimum:-180,maximum:180},power:{type:'number',minimum:90,maximum:500}},required:['angle','power'],additionalProperties:false},execute:x=>{api.aim(x.angle,x.power);return api.state()}});}catch{}}
resize();initHole();requestAnimationFrame(frame);
</script></body></html>
