*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#090b20;color:#eef5ff;font-family:ui-sans-serif,system-ui,sans-serif;display:flex;flex-direction:column}button{font:inherit;cursor:pointer;color:inherit;border:1px solid #ffffff25;background:#ffffff09;border-radius:10px;padding:10px 14px;touch-action:manipulation}button:hover{background:#ffffff18}button:focus-visible{outline:3px solid #b1ffec;outline-offset:3px}header{height:76px;flex-shrink:0;padding:12px 24px;display:flex;align-items:center;gap:20px;border-bottom:1px solid #ffffff14}h1{font-size:21px;letter-spacing:-.8px;margin:0;line-height:1.05}h1 span{display:block;color:#a18dff;letter-spacing:3px;font-size:12px;margin-top:5px;font-weight:600}.metrics{display:flex;gap:24px;margin-left:auto}.metric small{display:block;color:#939cb9;font-size:11px;letter-spacing:1.7px;text-transform:uppercase}.metric b{font-size:21px;font-variant-numeric:tabular-nums}.tools{display:flex;gap:7px}main{flex:1;min-height:0;position:relative;background:radial-gradient(ellipse at 50% 0,#27205170,transparent 67%)}canvas{height:100%;width:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:22px;background:#060a2070;backdrop-filter:blur(4px)}.overlay.hidden{display:none}.card{max-width:400px;text-align:center;padding:32px;background:#13162aee;border:1px solid #9990ff40;border-radius:22px;box-shadow:0 30px 100px #0008}.eyebrow{color:#b0ffeb;font-size:12px;letter-spacing:3px;text-transform:uppercase}.card h2{font-size:38px;letter-spacing:-1.8px;line-height:1.05;margin:14px 0}.card p{color:#afb7d0;font-size:16px;line-height:1.6}.card button{background:#b1ffec;color:#102129;border:0;font-weight:750;min-width:160px;margin-top:10px}.legend{display:flex;gap:16px;justify-content:center;color:#b1ffec;font-size:13px;margin-top:18px}footer{min-height:49px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 24px;border-top:1px solid #ffffff14;color:#8d97b6;font-size:13px}.hint{color:#bdc7e4}#effect{color:#b1ffec}#launch{font-size:13px;padding:7px 15px;background:#c1afff22;color:#deceff}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:620px){header{padding:10px 12px;height:70px;gap:12px}h1{font-size:17px}h1 span{font-size:10px;letter-spacing:2px}.metrics{gap:12px}.metric b{font-size:18px}.metric small{font-size:9px;letter-spacing:1px}.tools button{padding:9px;font-size:13px}.tools #restart{padding:8px 10px;font-size:18px}footer{padding:8px 12px;font-size:11px}.card{padding:26px}.card h2{font-size:34px}.hint .desktop{display:none}.legend{font-size:12px;gap:12px}}
</style></head><body><header><h1>PRISM<span>BREAKER</span></h1><div class="metrics"><div class="metric"><small>Score</small><b id="score">0</b></div><div class="metric"><small>Wave</small><b id="wave">01</b></div><div class="metric"><small>Lives</small><b id="lives">3</b></div></div><div class="tools"><button id="pause" aria-label="Pause game">Pause</button><button id="restart" aria-label="Restart game" title="Restart game">↻</button></div></header><main><canvas id="game" aria-label="Prism Breaker playfield. Move the paddle with arrow keys or drag. Space launches the ball."></canvas><div id="overlay" class="overlay"><section class="card"><div class="eyebrow" id="eyebrow">Refraction arcade</div><h2 id="title">Make a<br>clean break.</h2><p id="message">Move the paddle. Shatter every prism.<br>Catch the falling powerups and keep your last light alive.</p><button id="primary">Play</button><div class="legend"><span>↔ Move / drag</span><span>Space · launch</span><span>P · pause</span></div></section></div><div class="sr" id="announce" aria-live="polite"></div></main><footer><span class="hint">Drag to move <span class="desktop">· ← → / A D</span> · tap to launch</span><span id="effect">WIDE / SPLIT / SHIELD</span><button id="launch">Launch</button></footer><script>
(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),$=s=>document.getElementById(s),W=800,COLORS=['#aa86ff','#ed84d9','#ffb268','#ffe69d','#a7efd8','#78c6ff'];let H=850;let state='ready',score=0,lives=3,wave=1,paddle={x:400,y:780,w:120},balls=[],bricks=[],drops=[],particles=[],keys={},target=null,wide=0,shield=0,combo=0,scale=1,ox=0,oy=0,last=0,acc=0,clock=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);H=Math.max(850,Math.min(1450,r.height/r.width*W));paddle.y=H-70;scale=Math.min(r.width/W,r.height/H);ox=(r.width-W*scale)/2;oy=(r.height-H*scale)/2;ctx.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',resize);resize();
function hud(){$('score').textContent=score;$('wave').textContent=String(wave).padStart(2,'0');$('lives').textContent=lives;$('effect').textContent=wide>0?'WIDE '+Math.ceil(wide)+'s':shield?'SHIELD READY':'WIDE / SPLIT / SHIELD';$('launch').textContent=balls.some(b=>b.stuck)?'Launch':'In flight'}
function createWave(){bricks=[];const rows=Math.min(5+Math.floor(wave/2),8),cols=10,bw=65,bh=26,gap=7;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const pattern=(wave-1)%4;if(pattern===1&&((r+c)%5===0))continue;if(pattern===2&&Math.abs(c-4.5)>r+2)continue;if(pattern===3&&(r%2&&c%3===0))continue;bricks.push({x:43+c*(bw+gap),y:110+r*(bh+gap),w:bw,h:bh,hp:wave>2&&r<2?2:1,color:COLORS[r%6]})}combo=0;drops=[];newBall();hud()}
function newBall(){balls=[{x:paddle.x,y:paddle.y-13,vx:0,vy:0,r:8,stuck:true,trail:[]}];}
function reset(){score=0;lives=3;wave=1;wide=0;shield=0;particles=[];paddle.x=400;paddle.w=120;target=null;createWave();state='playing';$('overlay').classList.add('hidden');$('pause').textContent='Pause';hud()}
function launch(){if(state==='ready'||state==='over'){reset();return}if(state!=='playing')return;for(const b of balls)if(b.stuck){b.stuck=false;b.vx=190*(Math.random()<.5?-1:1);b.vy=-370}}
function pause(){if(state==='playing'){state='paused';show('Paused','Take a breath.','Your prisms will wait.','Resume');$('pause').textContent='Resume'}else if(state==='paused'){state='playing';$('overlay').classList.add('hidden');$('pause').textContent='Pause'}}
function show(eyebrow,title,message,button){$('eyebrow').textContent=eyebrow;$('title').textContent=title;$('message').textContent=message;$('primary').textContent=button;$('overlay').classList.remove('hidden')}
function burst(x,y,color,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*210,vy:(Math.random()-.5)*210,t:.4+Math.random()*.3,color})}
function hitBrick(b,k){k.hp--;score+=k.hp?5:10+Math.min(combo,10)*2;combo++;burst(b.x,b.y,k.color);if(!k.hp&&Math.random()<.18)drops.push({x:k.x+k.w/2,y:k.y,type:['W','M','S'][Math.floor(Math.random()*3)]});hud()}
function applyDrop(type){if(type==='W')wide=14;if(type==='S')shield=1;if(type==='M'){const source=balls.find(b=>!b.stuck);if(source&&balls.length<5)for(const a of [-.45,.45]){let vx=source.vx*Math.cos(a)-source.vy*Math.sin(a),vy=source.vx*Math.sin(a)+source.vy*Math.cos(a);balls.push({x:source.x,y:source.y,vx,vy:Math.abs(vy)<120?-220:vy,r:8,stuck:false,trail:[]})}}score+=25;burst(paddle.x,paddle.y,'#b1ffec',24);hud()}
function update(dt){clock+=dt;if(wide>0)wide=Math.max(0,wide-dt);paddle.w=wide>0?190:120;let dir=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);if(dir){paddle.x+=dir*630*dt;target=null}else if(target!==null)paddle.x+=(target-paddle.x)*Math.min(1,dt*24);paddle.x=clamp(paddle.x,20+paddle.w/2,W-20-paddle.w/2);for(const b of balls){if(b.stuck){b.x=paddle.x;b.y=paddle.y-13;continue}const steps=Math.max(1,Math.ceil(Math.hypot(b.vx,b.vy)*dt/6)),st=dt/steps;for(let j=0;j<steps;j++){let px=b.x,py=b.y;b.x+=b.vx*st;b.y+=b.vy*st;if(b.x<20+b.r){b.x=20+b.r;b.vx=Math.abs(b.vx)}if(b.x>W-20-b.r){b.x=W-20-b.r;b.vx=-Math.abs(b.vx)}if(b.y<32+b.r){b.y=32+b.r;b.vy=Math.abs(b.vy)}if(b.vy>0&&py+b.r<=paddle.y&&b.y+b.r>=paddle.y&&Math.abs(b.x-paddle.x)<=paddle.w/2+b.r){const offset=clamp((b.x-paddle.x)/(paddle.w/2),-.97,.97),speed=Math.min(640,Math.hypot(b.vx,b.vy)+7);b.vx=Math.sin(offset*1.1)*speed;b.vy=-Math.cos(offset*1.1)*speed;b.y=paddle.y-b.r;combo=0;burst(b.x,b.y,'#b1ffec',4)}for(const k of bricks){if(!k.hp)continue;const cx=clamp(b.x,k.x,k.x+k.w),cy=clamp(b.y,k.y,k.y+k.h);if((b.x-cx)**2+(b.y-cy)**2<b.r*b.r){if(px<k.x||px>k.x+k.w){b.vx*=-1;b.x=px}else{b.vy*=-1;b.y=py}hitBrick(b,k);break}}if(shield&&b.y>H-50&&b.vy>0){b.y=H-50;b.vy=-Math.abs(b.vy);shield=0;burst(b.x,b.y,'#b1ffec',30)}if(b.y>H+20)break}b.trail.unshift({x:b.x,y:b.y});if(b.trail.length>9)b.trail.pop()}
balls=balls.filter(b=>b.y<H+20);if(!balls.length){lives--;wide=0;shield=0;drops=[];if(lives<=0){state='over';show('Run complete','Light out.',`Score ${score} · Wave ${wave}. Find your rhythm and try again.`,'Play again');$('announce').textContent='Game over. Score '+score}else newBall();hud()}for(const d of drops){d.y+=150*dt;if(d.y>=paddle.y-10&&d.y<=paddle.y+25&&Math.abs(d.x-paddle.x)<paddle.w/2+14){applyDrop(d.type);d.y=H+40}}drops=drops.filter(d=>d.y<H+30);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt});particles=particles.filter(p=>p.t>0);if(state==='playing'&&bricks.every(k=>!k.hp)){wave++;score+=100;createWave();$('announce').textContent='Wave '+wave}hud()}
function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);ctx.strokeStyle='#99a9ff09';ctx.lineWidth=1;for(let x=20;x<W;x+=38){ctx.beginPath();ctx.moveTo(x,32);ctx.lineTo(x,H-25);ctx.stroke()}for(let y=32;y<H;y+=38){ctx.beginPath();ctx.moveTo(20,y);ctx.lineTo(W-20,y);ctx.stroke()}ctx.strokeStyle='#888fff30';ctx.strokeRect(20,32,W-40,H-65);ctx.font='600 12px system-ui';ctx.fillStyle='#727f9e';ctx.textAlign='left';ctx.fillText('SPECTRUM / '+String(wave).padStart(2,'0'),43,77);ctx.textAlign='right';ctx.fillText(bricks.filter(k=>k.hp).length+' PRISMS',755,77);for(const k of bricks){if(!k.hp)continue;ctx.shadowColor=k.color;ctx.shadowBlur=12;round(k.x,k.y,k.w,k.h,5,k.color);ctx.shadowBlur=0;round(k.x+2,k.y+2,k.w-4,3,2,'#ffffff66');ctx.fillStyle='#08152e22';ctx.beginPath();ctx.moveTo(k.x+10,k.y+k.h);ctx.lineTo(k.x+30,k.y);ctx.lineTo(k.x+38,k.y);ctx.lineTo(k.x+18,k.y+k.h);ctx.fill();if(k.hp>1){ctx.strokeStyle='#fff';ctx.strokeRect(k.x+5,k.y+5,k.w-10,k.h-10)}}for(const b of balls){b.trail.forEach((p,i)=>{ctx.globalAlpha=(1-i/9)*.22;ctx.fillStyle='#bcabff';ctx.beginPath();ctx.arc(p.x,p.y,b.r*(1-i/12),0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;ctx.shadowBlur=24;ctx.shadowColor='#e0ccff';ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}ctx.shadowBlur=25;ctx.shadowColor='#8cffda';round(paddle.x-paddle.w/2,paddle.y,paddle.w,13,7,'#b1ffec');ctx.shadowBlur=0;round(paddle.x-15,paddle.y+3,30,3,2,'#538b8a');if(shield){ctx.strokeStyle='#b1ffec';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(20,H-49);ctx.lineTo(W-20,H-49);ctx.stroke()}for(const d of drops){round(d.x-15,d.y-14,30,28,7,'#b1ffec');ctx.fillStyle='#16313c';ctx.textAlign='center';ctx.font='800 16px system-ui';ctx.fillText(d.type,d.x,d.y+6)}for(const p of particles){ctx.globalAlpha=Math.min(1,p.t*2);round(p.x,p.y,3,3,1,p.color)}ctx.globalAlpha=1;if(balls.some(b=>b.stuck)&&state==='playing'){ctx.textAlign='center';ctx.font='500 17px system-ui';ctx.fillStyle='#a8b5d4';ctx.fillText('Tap or press Space to launch',400,paddle.y-70)}ctx.restore()}
function frame(t){let dt=Math.min((t-last)/1000,.05);last=t;if(state==='playing')update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);createWave();
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons){const r=canvas.getBoundingClientRect();target=(e.clientX-r.left-ox)/scale}});canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const r=canvas.getBoundingClientRect();target=(e.clientX-r.left-ox)/scale;launch()});document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','p','P','r','R'].includes(e.key))e.preventDefault();keys[e.key]=true;if(!e.repeat){if(e.key===' ')launch();if(e.key.toLowerCase()==='p')pause();if(e.key.toLowerCase()==='r')reset()}});document.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('blur',()=>{keys={};if(state==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});$('pause').onclick=pause;$('restart').onclick=reset;$('launch').onclick=launch;$('primary').onclick=()=>state==='paused'?pause():reset();window.__game={get state(){return {state,score,lives,wave,paddle,balls,bricks,drops,wide,shield}},reset,update,launch,pause,applyDrop,createWave,set:(o)=>{if(o.lives!==undefined)lives=o.lives;if(o.bricks)bricks=o.bricks;if(o.balls)balls=o.balls},resize};})();

(()=>{const context=document.modelContext;if(!context?.registerTool)return;const lifecycle=new AbortController();const tool={name:'read_game_state',title:'Read game state',description:'Read the current score, mode and gameplay state.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(input){if(input&&Object.keys(input).length)throw new Error('No arguments expected');const s=window.__game.state;return {mode:s.state,score:s.score??s.delivered,lives:s.lives,strikes:s.strikes,wave:s.wave??s.level}}};try{Promise.resolve(context.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true})}catch{}})();
