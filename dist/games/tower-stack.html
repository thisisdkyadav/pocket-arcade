<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tower Stack</title><meta name="description" content="Time the drop, trim the edges, and stack forty floors above the city."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23141129'/%3E%3Cpath d='M8 29h24v7H8zM11 19h20v7H11zM14 9h16v7H14z' fill='%23ffc587'/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#151222;font-family:ui-sans-serif,system-ui,sans-serif;color:#fff6ed}body{display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 90%,#63415b 0,#221c35 50%,#121223 100%)}header{height:66px;display:flex;flex:none;justify-content:space-between;align-items:center;padding:0 26px;border-bottom:1px solid #ffffff14}h1{font-size:18px;margin:0;letter-spacing:3px}h1 span{font-weight:300;color:#ffca96}button{font:600 14px system-ui;color:#fff8ef;background:#ffffff0f;border:1px solid #ffffff25;border-radius:8px;min-height:42px;padding:0 18px;cursor:pointer}button:hover{background:#ffffff24}button:focus-visible,canvas:focus-visible{outline:3px solid #ffc88f;outline-offset:2px}.top{display:flex;gap:10px;align-items:center}.top small{color:#c0aec9;font-size:13px;margin-right:15px}main{position:relative;flex:1;min-height:0;overflow:hidden;display:grid;place-items:center}canvas{height:100%;width:100%;display:block;touch-action:manipulation;cursor:pointer}#hud{position:absolute;top:24px;left:0;right:0;text-align:center;pointer-events:none}#count{font-size:clamp(52px,10vh,86px);font-weight:200;line-height:1;letter-spacing:-4px}#hud p{font-size:12px;letter-spacing:3px;color:#ceb8ce;margin:8px 0}#flash{height:24px;color:#ffe0a5;font-size:15px;font-weight:600;margin-top:14px}#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#14112788;backdrop-filter:blur(7px)}#overlay.show{display:flex}.panel{border:1px solid #ffc59740;background:#221d36ed;border-radius:20px;text-align:center;padding:32px;max-width:90%;box-shadow:0 30px 100px #0005}.panel h2{font-weight:400;font-size:38px;margin:0 0 12px;letter-spacing:-1px}.panel p{color:#d1bfd5;font-size:16px;line-height:1.6;margin-bottom:24px}.panel button{background:#ffc58b;color:#251b30;border:0;min-width:160px}.panel .sub{display:block;background:transparent;color:#ffc58b;margin:10px auto 0;font-weight:400}footer{flex:none;display:flex;justify-content:center;align-items:center;gap:22px;padding:13px 15px max(13px,env(safe-area-inset-bottom));border-top:1px solid #ffffff12}#drop{background:#ffc58b;color:#21192c;border:0;min-width:210px}footer span{font-size:13px;color:#c6b3ca}@media(max-width:550px){header{height:58px;padding:0 14px}h1{font-size:16px;letter-spacing:2px}.top small{margin-right:0}.top button{padding:0 12px}footer{gap:12px}footer span{font-size:12px;max-width:90px}#drop{min-width:180px}#hud{top:20px}}@media(max-height:520px){header{height:44px}footer{padding:5px}#count{font-size:42px}#hud{top:8px}#flash{margin-top:5px}#hud p{margin:3px 0}button{min-height:34px}}
</style></head><body><header><h1>TOWER <span>STACK</span></h1><div class="top"><small>BEST <b id="best">0</b></small><button id="pause" aria-label="Pause game">Ⅱ</button><button id="restart" aria-label="Restart game">↻</button></div></header><main><canvas id="game" tabindex="0" aria-label="Moving tower block. Tap or press space to drop it."></canvas><div id="hud"><div id="count">0</div><p id="goal">FLOORS / 40</p><div id="flash" role="status" aria-live="polite"></div></div><div id="overlay"><div class="panel"><h2 id="title">A little too far.</h2><p id="detail">Your tower reached 0 floors.</p><button id="again">Build again</button><button id="continue" class="sub" hidden>Keep building</button></div></div></main><footer><button id="drop">Drop block</button><span>Tap or Space<br>P pause · R restart</span></footer><script>
'use strict';const $=s=>document.getElementById(s),canvas=$('game'),ctx=canvas.getContext('2d'),W=540,H=780,BH=26,baseY=685;let blocks=[],moving=null,falling=[],particles=[],score=0,best=0,combo=0,mode='playing',paused=false,endless=false,camera=0,last=0,viewW=540,viewH=780,scale=1,ox=0,oy=0,flashTime=0,lastDrop=-1000;
try{best=+localStorage.getItem('tower-stack-best')||0}catch{}$('best').textContent=best;
function color(n,l=62){return'hsl('+((28+n*8)%360)+' 80% '+l+'%)'}
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);viewW=r.width;viewH=r.height;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);scale=Math.min(viewW/W,viewH/H);ox=(viewW-W*scale)/2;oy=(viewH-H*scale)/2;}
function spawn(){const top=blocks[blocks.length-1],dir=score%2===0?1:-1;moving={x:dir>0?25:W-25-top.w,w:top.w,y:baseY-(score+1)*BH,dir,speed:Math.min(400,135+score*8),n:score+1};}
function reset(){score=0;combo=0;camera=0;mode='playing';paused=false;endless=false;blocks=[{x:150,w:240,y:baseY,n:0}];falling=[];particles=[];$('count').textContent='0';$('goal').textContent='FLOORS / 40';$('flash').textContent='Find the rhythm';flashTime=2;$('overlay').classList.remove('show');$('pause').textContent='Ⅱ';$('drop').disabled=false;lastDrop=-1000;spawn();}
function record(){if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('tower-stack-best',best)}catch{}}}
function overlay(title,detail,win=false){$('title').textContent=title;$('detail').textContent=detail;$('continue').hidden=!win;$('overlay').classList.add('show');$('drop').disabled=true;}
function flash(text){$('flash').textContent=text;flashTime=1.6;}
function drop(){if(mode!=='playing'||paused)return;const now=performance.now();if(now-lastDrop<160)return;lastDrop=now;const top=blocks[blocks.length-1],delta=moving.x-top.x;let left=Math.max(moving.x,top.x),right=Math.min(moving.x+moving.w,top.x+top.w),width=right-left;if(width<=0){falling.push({...moving,vx:moving.dir*80,vy:0});moving=null;mode='lost';record();overlay('A little too far.',score+' floors. One more try?');return;}
if(Math.abs(delta)<=5){left=top.x;width=top.w;combo++;flash(combo>=3?'Perfect ×'+combo+' · +12 width':'Perfect alignment');for(let i=0;i<20;i++)particles.push({x:left+Math.random()*width,y:moving.y,vx:(Math.random()-.5)*180,vy:-Math.random()*160,life:1});if(combo>=3){const add=Math.min(12,240-width);left=Math.max(25,Math.min(W-25-width-add,left-add/2));width+=add;}}else{combo=0;flash('−'+Math.round(top.w-width)+' width');const cutX=delta<0?moving.x:right,cutW=Math.abs(delta);falling.push({x:cutX,w:cutW,y:moving.y,n:moving.n,vx:delta<0?-50:50,vy:0});}
blocks.push({x:left,w:width,y:moving.y,n:moving.n});score++;$('count').textContent=score;record();if(score===40&&!endless){mode='won';moving=null;overlay('Above the city.', '40 floors. Beautiful timing.',true);}else spawn();}
function pause(){if(mode!=='playing')return;paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';flash(paused?'Paused':'Back to the rhythm');}
function update(dt){if(paused)return;if(mode==='playing'&&moving){moving.x+=moving.dir*moving.speed*dt;const min=25,max=W-25-moving.w;if(moving.x<min){moving.x=2*min-moving.x;moving.dir=1;}if(moving.x>max){moving.x=2*max-moving.x;moving.dir=-1;}}const target=Math.max(0,score*BH-310);camera+=(target-camera)*Math.min(1,dt*7);for(const f of falling){f.vy+=750*dt;f.y+=f.vy*dt;f.x+=f.vx*dt;}falling=falling.filter(f=>f.y-camera<1100);for(const p of particles){p.vy+=250*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}particles=particles.filter(p=>p.life>0);if(flashTime>0){flashTime-=dt;if(flashTime<=0)$('flash').textContent='';}}
function block(b,alpha=1){const y=b.y+camera;ctx.globalAlpha=alpha;ctx.fillStyle=color(b.n,55);ctx.fillRect(b.x,y,b.w,BH-2);ctx.fillStyle=color(b.n,72);ctx.beginPath();ctx.moveTo(b.x,y);ctx.lineTo(b.x+12,y-10);ctx.lineTo(b.x+b.w+12,y-10);ctx.lineTo(b.x+b.w,y);ctx.closePath();ctx.fill();ctx.fillStyle=color(b.n,38);ctx.beginPath();ctx.moveTo(b.x+b.w,y);ctx.lineTo(b.x+b.w+12,y-10);ctx.lineTo(b.x+b.w+12,y+BH-12);ctx.lineTo(b.x+b.w,y+BH-2);ctx.closePath();ctx.fill();ctx.fillStyle='#ffffff22';ctx.fillRect(b.x,y,b.w,2);ctx.globalAlpha=1;}
function render(t){ctx.clearRect(0,0,viewW,viewH);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#171629');g.addColorStop(.6,'#35273f');g.addColorStop(1,'#795268');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<40;i++){ctx.fillStyle='#ffe6c34a';ctx.fillRect((i*127.19)%W,(i*57.83)%510,1.5,1.5);}ctx.fillStyle='#ffd1a533';ctx.beginPath();ctx.arc(423,135,35,0,7);ctx.fill();for(let i=0;i<17;i++){const h=35+((i*49)%98);ctx.fillStyle=i%2?'#1c1c3399':'#25223c99';ctx.fillRect(i*35-12,H-h,30,h);for(let j=0;j<4;j++){ctx.fillStyle='#ffdaaa20';ctx.fillRect(i*35-5,H-h+15+j*17,3,6);}}
ctx.strokeStyle='#ffcaa018';ctx.setLineDash([5,10]);ctx.beginPath();ctx.moveTo(270,180);ctx.lineTo(270,H);ctx.stroke();ctx.setLineDash([]);for(const b of blocks){if(b.y+camera < -30||b.y+camera>H+50)continue;block(b);}if(moving){const top=blocks[blocks.length-1];ctx.fillStyle='#ffeac308';ctx.fillRect(top.x,Math.max(180,moving.y+camera-40),top.w,H);block(moving);}for(const f of falling)block(f,.75);for(const p of particles){ctx.globalAlpha=p.life;ctx.fillStyle='#ffe7a5';ctx.fillRect(p.x,p.y+camera,3,3);}ctx.globalAlpha=1;ctx.restore();}
function frame(t){const dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);render(t);requestAnimationFrame(frame);}
$('drop').onclick=()=>{drop();canvas.focus()};canvas.addEventListener('pointerdown',e=>{e.preventDefault();drop();canvas.focus()});$('restart').onclick=reset;$('again').onclick=reset;$('pause').onclick=pause;$('continue').onclick=()=>{endless=true;mode='playing';$('overlay').classList.remove('show');$('drop').disabled=false;$('goal').textContent='FLOORS / ENDLESS';spawn();};addEventListener('keydown',e=>{if([' ','r','R','p','P','Enter'].includes(e.key)){if(e.key==='Enter'&&e.target.tagName==='BUTTON')return;e.preventDefault();if(e.repeat)return;if(e.key===' '||e.key==='Enter'){if(mode==='lost')reset();else if(paused)pause();else drop();}if(e.key.toLowerCase()==='r')reset();if(e.key.toLowerCase()==='p')pause();}});addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused&&mode==='playing')pause()});
window.TowerStack={state:()=>({score,best,combo,mode,paused,endless,moving:moving?{...moving}:null,top:{...blocks[blocks.length-1]}}),drop,reset,pause};if(document.modelContext?.registerTool){try{document.modelContext.registerTool({name:'tower_stack_state',description:'Read the tower height, width and moving block state.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>window.TowerStack.state()});document.modelContext.registerTool({name:'tower_stack_restart',description:'Start a new tower game, resetting the current run.',inputSchema:{type:'object',properties:{},additionalProperties:false},execute:x=>{if(x&&Object.keys(x).length)throw Error('No parameters expected');reset();return window.TowerStack.state()}});}catch{}}
resize();reset();requestAnimationFrame(frame);
</script></body></html>
